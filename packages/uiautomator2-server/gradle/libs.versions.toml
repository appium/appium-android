[versions]
androidGradlePlugin = "9.5.1"
gson = "2.15.0"
junidecode = "0.5.2"
junit = "4.13.2"
nettyBuffer = "4.2.21.Final"
nettyCommon = "4.2.21.Final"
nettyTransport = "4.2.21.Final"
nettyCodecHttp = "4.2.21.Final"
nettyHandler = "4.2.21.Final"
mockito = "5.24.0"
robolectric = "4.18.1"
unmockplugin = "0.11.0"
xpath2Processor = "2.0.7"
uiautomator = "2.4.1"
androidx-test-core = "1.7.0"
androidx-test-junit = "1.3.0"
androidx-test-runner = "1.7.0"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
junidecode = { module = "net.gcardone.junidecode:junidecode", version.ref = "junidecode" }
junit = { module = "junit:junit", version.ref = "junit" }
netty-buffer = { module = "io.netty:netty-buffer", version.ref = "nettyBuffer" }
netty-common = { module = "io.netty:netty-common", version.ref = "nettyCommon" }
netty-transport = { module = "io.netty:netty-transport", version.ref = "nettyTransport" }
netty-codec-http = { module = "io.netty:netty-codec-http", version.ref = "nettyCodecHttp" }
netty-handler = { module = "io.netty:netty-handler", version.ref = "nettyHandler" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
unmockplugin = { module = "com.github.bjoernq:unmockplugin", version.ref = "unmockplugin" }
xpath2-processor = { module = "com.github.appium.appium-android:xpath2-processor", version.ref = "xpath2Processor" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-junit = {module = "androidx.test.ext:junit",version.ref = "androidx-test-junit"}
androidx-test-runner = {module = "androidx.test:runner", version.ref = "androidx-test-runner"}

[bundles]
androix-test = ["androidx-test-core","androidx-test-junit","androidx-test-runner"]
netty-core = ["netty-buffer","netty-common","netty-transport"]
netty-http = ["netty-codec-http","netty-handler"]

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
unmockplugin = { id = "de.mobilej.unmock", version.ref = "unmockplugin" }