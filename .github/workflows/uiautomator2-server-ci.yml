name: appium-uiautomator2-server CI

# Android-side checks (Gradle lint, unit tests, vendored XPath2 tests, wrapper validation)
# for packages/uiautomator2-server. JS lint/format are covered by build.yml.

on:
  push:
    branches: [main]
    paths: ['packages/uiautomator2-server/**', '.github/workflows/uiautomator2-server-ci.yml']
  pull_request:
    branches: [main]
    paths: ['packages/uiautomator2-server/**', '.github/workflows/uiautomator2-server-ci.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gradle-wrapper-validation:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

  java-test:
    name: Android Lint and Unit Tests
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - name: Use Java 22
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle
      - name: Setup, install and build
        uses: ./.github/actions/setup-build
        with:
          node-version: lts/*
      - name: Android lint
        run: npm run lint:java --workspace appium-uiautomator2-server
      - name: Server unit tests
        run: npm run test:android --workspace appium-uiautomator2-server
      - name: Vendored XPath2 processor unit tests
        run: npm run test:vendor-xpath2 --workspace appium-uiautomator2-server
