name: android-apidemos CI

# Android-side checks (APK build) for packages/android-apidemos.
# JS lint/format are covered by build.yml.

on:
  push:
    branches: [main]
    paths: ['packages/android-apidemos/**', '.github/workflows/android-apidemos-ci.yml']
  pull_request:
    branches: [main]
    paths: ['packages/android-apidemos/**', '.github/workflows/android-apidemos-ci.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/android-apidemos

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ApiDemos-debug.apk
          path: packages/android-apidemos/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: ApiDemos-release.apk
          path: packages/android-apidemos/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
