name: Appium Android Automated Release

on:
  push:
    branches:
      - main
  # Also callable from manual-release.yml so a manual/recovery run publishes to npm as
  # this same workflow file
  workflow_call:
    inputs:
      dry_run:
        description: 'Dry run (no publishing or tagging)'
        required: false
        type: boolean
        default: false
      recover_missing_only:
        description: 'Recovery mode: skip version bump, publish only packages missing on npm at their current package.json version'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # to enable use of OIDC for trusted publishing and npm provenance

# Avoid two releases racing each other; queue rather than cancel a publish in progress.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # io.appium.settings builds its APK in prepublishOnly, so Java is needed at publish time.
      - name: Use Java 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'

      - name: Setup Node and install deps (LTS)
        uses: ./.github/actions/setup-build
        with:
          node-version: lts/*

      - name: Run Lerna publish
        id: run-lerna-publish
        uses: ./.github/actions/lerna-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: ${{ inputs.dry_run || false }}
          recover_missing_only: ${{ inputs.recover_missing_only || false }}

      - name: Upload settings APK to the GitHub release
        if: steps.run-lerna-publish.outputs.settings_release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.run-lerna-publish.outputs.settings_release_tag }}
        run: gh release upload "$RELEASE_TAG" packages/settings/apks/settings_apk-debug.apk --clobber
