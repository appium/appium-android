name: Appium Android Release

on:
  push:
    branches:
      - main
  # Manual/recovery runs live in this file too: npm's trusted publisher (OIDC) matches the
  # top-level workflow file, so a reusable-workflow wrapper can't publish.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no publishing or tagging)'
        required: true
        type: boolean
        default: true
      recover_missing_only:
        description: 'Recovery mode: skip version bump, publish only packages missing on npm at their current package.json version'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # to enable use of OIDC for trusted publishing and npm provenance

# Avoid two releases racing each other; queue rather than cancel a publish in progress.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # `lerna publish` fails with EBEHIND if main moved on after this run was triggered (e.g. while
  # queued behind another release), so a stale push-triggered run bows out; the run for the
  # newer commit releases everything this one would have.
  check-head:
    # Manual runs are limited to maintainers on main; the release job needs this one.
    if: ${{ github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/main' && contains(fromJSON('["mykola-mokhnach", "jlipps", "eglitise", "KazuCocoa"]'), github.actor)) }}
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.head.outputs.stale }}
    steps:
      - name: Compare with the current head of main
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          stale=false
          if [ "$EVENT_NAME" = "push" ]; then
            head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
            if [ "$head_sha" != "$GITHUB_SHA" ]; then
              stale=true
              echo "::notice::main moved to ${head_sha} since ${GITHUB_SHA}; skipping, the run for the newer commit will release"
            fi
          fi
          echo "stale=${stale}" >> "$GITHUB_OUTPUT"

  release:
    needs: check-head
    if: ${{ needs.check-head.outputs.stale != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # io.appium.settings builds its APK in prepublishOnly, so Java is needed at publish time.
      - name: Use Java 22
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '22'

      - name: Setup Node and install deps (LTS)
        uses: ./.github/actions/setup-build
        with:
          node-version: lts/*

      - name: Run Lerna publish
        id: run-lerna-publish
        uses: ./.github/actions/lerna-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: ${{ inputs.dry_run || false }}
          recover_missing_only: ${{ inputs.recover_missing_only || false }}

      # Runs on every non-dry run (not just after a publish) so a failed upload is retried by
      # the next run, including recovery runs that find nothing missing on npm.
      - name: Ensure settings APK is attached to its GitHub release
        if: ${{ !(inputs.dry_run || false) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk_name=settings_apk-debug.apk
          tag="io.appium.settings@$(jq -r .version packages/settings/package.json)"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "No GitHub release for ${tag}; nothing to attach the APK to"
            exit 0
          fi
          if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx "$apk_name"; then
            echo "${tag} already has ${apk_name}"
            exit 0
          fi

          # prepublishOnly leaves the APK behind after a publish; rebuild only if it's missing
          if [ ! -f "packages/settings/apks/${apk_name}" ]; then
            npm run build:apk --workspace io.appium.settings
          fi
          gh release upload "$tag" "packages/settings/apks/${apk_name}"

      # Private package (not on npm): its APKs are attached to the GitHub release created by lerna.
      # Runs on every non-dry run so a failed upload is retried by the next run.
      - name: Ensure compose-playground APKs are attached to its GitHub release
        if: ${{ !(inputs.dry_run || false) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="compose-playground@$(jq -r .version packages/compose-playground/package.json)"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "No GitHub release for ${tag}; nothing to attach the APKs to"
            exit 0
          fi
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          if grep -qx ComposePlayground-debug.apk <<<"$assets" && grep -qx ComposePlayground-release.apk <<<"$assets"; then
            echo "${tag} already has its APKs"
            exit 0
          fi

          (
            cd packages/compose-playground
            ./gradlew assembleDebug assembleRelease
            cp app/build/outputs/apk/debug/app-debug.apk ComposePlayground-debug.apk
            cp app/build/outputs/apk/release/app-release-unsigned.apk ComposePlayground-release.apk
          )
          gh release upload "$tag" --clobber \
            packages/compose-playground/ComposePlayground-debug.apk \
            packages/compose-playground/ComposePlayground-release.apk

      # Private package (not on npm): its APKs are attached to the GitHub release created by lerna.
      # Runs on every non-dry run so a failed upload is retried by the next run.
      - name: Ensure android-apidemos APKs are attached to its GitHub release
        if: ${{ !(inputs.dry_run || false) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="android-apidemos@$(jq -r .version packages/android-apidemos/package.json)"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "No GitHub release for ${tag}; nothing to attach the APKs to"
            exit 0
          fi
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          if grep -qx ApiDemos-debug.apk <<<"$assets" && grep -qx ApiDemos-release.apk <<<"$assets"; then
            echo "${tag} already has its APKs"
            exit 0
          fi

          (
            cd packages/android-apidemos
            ./gradlew assembleDebug assembleRelease
            cp app/build/outputs/apk/debug/app-debug.apk ApiDemos-debug.apk
            cp app/build/outputs/apk/release/app-release-unsigned.apk ApiDemos-release.apk
          )
          gh release upload "$tag" --clobber \
            packages/android-apidemos/ApiDemos-debug.apk \
            packages/android-apidemos/ApiDemos-release.apk

      # Replaces semantic-release's APK upload. prepublishOnly leaves the APKs behind after a
      # publish; runs on every non-dry run so a failed upload is retried by the next run.
      - name: Ensure uiautomator2-server APKs are attached to its GitHub release
        if: ${{ !(inputs.dry_run || false) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(jq -r .version packages/uiautomator2-server/package.json)"
          tag="appium-uiautomator2-server@${version}"
          server_apk="appium-uiautomator2-server-v${version}.apk"
          test_apk=appium-uiautomator2-server-debug-androidTest.apk

          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "No GitHub release for ${tag}; nothing to attach the APKs to"
            exit 0
          fi
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          if grep -qx "$server_apk" <<<"$assets" && grep -qx "$test_apk" <<<"$assets"; then
            echo "${tag} already has its APKs"
            exit 0
          fi

          if [ ! -f "packages/uiautomator2-server/apks/${server_apk}" ] || [ ! -f "packages/uiautomator2-server/apks/${test_apk}" ]; then
            npm run build --workspace appium-uiautomator2-server
          fi
          gh release upload "$tag" --clobber \
            "packages/uiautomator2-server/apks/${server_apk}" \
            "packages/uiautomator2-server/apks/${test_apk}"

      # JitPack only sees plain vX.Y.Z tags (it rejects Lerna's name@X.Y.Z), so tag the xpath2-processor
      # version and request its artifacts so JitPack has built them before anything depends on them.
      # Runs on every non-dry run so a failed attempt is retried by the next run.
      - name: Ensure xpath2-processor is tagged for and built by JitPack
        if: ${{ !(inputs.dry_run || false) }}
        run: |
          set -euo pipefail
          version="$(jq -r .version packages/xpath2-processor/package.json)"
          gradle_version="$(sed -n 's/^xpath2Version=//p' packages/xpath2-processor/gradle.properties)"
          if [ "$version" != "$gradle_version" ]; then
            echo "::error::package.json version ${version} differs from xpath2Version ${gradle_version} in gradle.properties"
            exit 1
          fi

          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            # Reuse the tag if nothing outside lerna.json ignoreChanges (*.md, test/) differs from HEAD
            git fetch --no-tags --quiet origin "+refs/tags/${tag}:refs/tags/${tag}"
            if ! git diff --quiet "$tag" HEAD -- packages/xpath2-processor jitpack.yml \
              ':(exclude,glob)**/*.md' ':(exclude,glob)**/test/**'; then
              echo "::error::${tag} already exists but its sources differ from HEAD; bump the xpath2-processor version"
              exit 1
            fi
            echo "${tag} already exists and matches HEAD"
          else
            git tag "$tag"
            git push origin "refs/tags/${tag}"
          fi

          base="https://jitpack.io/com/github/appium/appium-android"
          for artifact in xpath2-processor xpath2-bom; do
            url="${base}/${artifact}/${version}/${artifact}-${version}.pom"
            built=false
            # JitPack needs a few minutes to notice a new tag and build it
            for attempt in $(seq 1 30); do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$url" || true)"
              if [ "$code" = 200 ]; then
                built=true
                break
              fi
              echo "${artifact} ${version}: HTTP ${code} (attempt ${attempt}/30)"
              sleep 15
            done
            if [ "$built" != true ]; then
              echo "::error::JitPack did not build ${artifact} ${version}; see https://jitpack.io/#appium/appium-android/${version}"
              exit 1
            fi
          done
