name: compose-playground CI

# Android-side checks (APK build, instrumented tests) for packages/compose-playground.
# JS lint/format are covered by build.yml.

on:
  push:
    branches: [main]
    paths: ['packages/compose-playground/**', '.github/workflows/compose-playground-ci.yml']
  pull_request:
    branches: [main]
    paths: ['packages/compose-playground/**', '.github/workflows/compose-playground-ci.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/compose-playground

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ComposePlayground-debug.apk
          path: packages/compose-playground/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: ComposePlayground-release.apk
          path: packages/compose-playground/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7

  instrumented-tests:
    name: Connected Android Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          working-directory: packages/compose-playground
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: |
            packages/compose-playground/app/build/reports/androidTests/
            packages/compose-playground/app/build/outputs/androidTest-results/
          retention-days: 7
