name: io.appium.settings Functional Tests

on:
  pull_request:
    branches: [main]
    paths: ['packages/settings/**', 'packages/adb/**', '.github/workflows/settings-functional-test.yml', '.github/workflows/emulator-matrix.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare_matrix:
    uses: ./.github/workflows/emulator-matrix.yml

  test:
    needs: prepare_matrix
    strategy:
      matrix:
        include: ${{ fromJSON(needs.prepare_matrix.outputs.matrix) }}
      fail-fast: false
    env:
      CI: true
      ANDROID_AVD: emulator
      ANDROID_SDK_VERSION: '${{ matrix.apiLevel }}'
      PLATFORM_VERSION: '${{ matrix.platformVersion }}'
      EMU_TAG: '${{ matrix.emuTag }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup, install and build
        uses: ./.github/actions/setup-build
        with:
          node-version: lts/*
      - name: Build APK
        run: npm run build:apk --workspace io.appium.settings
      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.apiLevel }}
      # https://github.com/marketplace/actions/android-emulator-runner
      - uses: reactivecircus/android-emulator-runner@v2
        if: steps.avd-cache.outputs.cache-hit != 'true'
        name: Generate AVD snapshot for caching
        with:
          script: echo "Generated AVD snapshot for caching."
          avd-name: $ANDROID_AVD
          force-avd-creation: false
          api-level: ${{ matrix.apiLevel }}
          disable-spellchecker: true
          target: ${{ matrix.emuTag }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          arch: ${{ matrix.arch }}
          disable-animations: true
      - uses: reactivecircus/android-emulator-runner@v2
        name: Run end-to-end tests
        with:
          # adb logcat is started here, not in an earlier step, because it must attach to
          # this emulator instance specifically - one started earlier (e.g. during the AVD
          # snapshot generation) dies with that emulator and captures nothing useful.
          script: |
            nohup adb logcat > logcat.log &
            npm run test:e2e --workspace io.appium.settings
          avd-name: $ANDROID_AVD
          force-avd-creation: false
          api-level: ${{ matrix.apiLevel }}
          disable-spellchecker: true
          target: ${{ matrix.emuTag }}
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          arch: ${{ matrix.arch }}
          disable-animations: true
      - name: Save logcat output
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: logcat-api${{ matrix.apiLevel }}
          path: logcat.log
