name: Appium Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CI: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare_matrix:
    uses: appium/appium-workflows/.github/workflows/node-lts-matrix.yml@main

  prepare_affected_packages:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      unit_packages: ${{ steps.discover-packages.outputs.unit_packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Discover packages affected by this PR
        id: discover-packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/discover-affected-packages.mjs

  test-unit:
    needs:
      - prepare_matrix
      - prepare_affected_packages
    # prepare_affected_packages only runs for pull_request; don't let its skip on push cascade
    # into skipping this job too (push always runs the full suite, see run-unit-tests.mjs).
    if: ${{ !cancelled() }}
    name: Unit Tests
    strategy:
      matrix:
        node-version: ${{ fromJSON(needs.prepare_matrix.outputs.versions) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup, install and build
        uses: ./.github/actions/setup-build
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run unit tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          UNIT_PACKAGES: ${{ needs.prepare_affected_packages.outputs.unit_packages }}
        run: node scripts/run-unit-tests.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup and install (no build)
        uses: ./.github/actions/setup-build
        with:
          node-version: lts/*
          run-build: 'false'
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
