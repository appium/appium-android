name: io.appium.settings CI

# Android-side checks (Gradle lint, APK build, wrapper validation) for packages/settings.
# JS lint/format/unit tests are covered by build.yml.

on:
  push:
    branches: [main]
    paths: ['packages/settings/**', '.github/workflows/settings-ci.yml']
  pull_request:
    branches: [main]
    paths: ['packages/settings/**', '.github/workflows/settings-ci.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gradle-wrapper-validation:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v4

  build:
    name: Android Lint and APK Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Java 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
      - name: Setup, install and build
        uses: ./.github/actions/setup-build
        with:
          node-version: lts/*
      - name: Android lint
        run: npm run lint:android --workspace io.appium.settings
      - name: Build APK
        run: npm run build:apk --workspace io.appium.settings
