version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/packages/*"
    schedule:
      interval: daily
      time: "11:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    versioning-strategy: increase-if-necessary
  - package-ecosystem: gradle
    directories:
      - "/packages/settings"
      - "/packages/compose-playground"
      - "/packages/android-apidemos"
    schedule:
      interval: daily
      time: "11:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
  - package-ecosystem: gradle
    directory: "/packages/uiautomator2-server"
    schedule:
      interval: weekly
      day: monday
      time: "11:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    ignore:
      # Netty majors are breaking; ICU4J is pinned for stability
      - dependency-name: "netty-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "icu4j"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      gradle-dependencies:
        patterns: ["*"]
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "11:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
